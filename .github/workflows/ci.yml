name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Install pinned English model
        env:
          PRESIDIO_NLP_MODEL: en_core_web_sm
        run: python scripts/install_model.py
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        env:
          PRESIDIO_NLP_MODEL: en_core_web_sm
        run: pytest
