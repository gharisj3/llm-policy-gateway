[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-policy-gateway"
version = "0.1.0"
description = "Policy enforcement gateway for language model requests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Muhammad Gharis Javed"}]
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.6",
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "pyyaml==6.0.3",
    "spacy==3.8.16",
    "sqlalchemy==2.0.54",
    "uvicorn==0.35.0",
]

[project.scripts]
lpg = "llm_policy_gateway.cli:main"

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "openai==3.19.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
